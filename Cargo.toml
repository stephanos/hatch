[package]
name = "hatch"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stephanos/hatch"

[[bin]]
name = "hatch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
camino = { version = "1.2.1", features = ["serde1"] }
clap = { version = "4.5.53", features = ["derive"] }
clap_complete = "4.5.61"
self_update = { version = "0.42.0", default-features = false, features = ["rustls"] }
shell-words = "1.1.0"
trash = "5.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.8"
skim = "4.6.2"
url = "2.5.8"
directories = "6.0.0"
anstream = "1.0.0"
anstyle = "1.0.14"
fs-err = "3.3.0"
rayon = "1.12.0"
nono = { version = "0.59.0", default-features = false }
sha2 = "0.11"
ureq = { version = "3", features = ["platform-verifier"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.23.0"
trycmd = "1.2.0"

[build-dependencies]
humantime = "2.2.0"
