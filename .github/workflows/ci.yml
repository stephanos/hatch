name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Set Up mise
        uses: jdx/mise-action@v2

      - name: Install Rust components
        run: |
          rustup component add rustfmt clippy

      - name: Format
        run: mise run fmt

      - name: Verify Formatting Is Clean
        run: git diff --exit-code

      - name: Lint And Build
        run: mise run check

      - name: Run Tests
        run: mise run test
